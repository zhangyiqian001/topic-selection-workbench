name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Configure Chromium path
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'CHROME_PATH=' + require('@playwright/test').chromium.executablePath() + '\n')"
      - run: npm run test:browser
